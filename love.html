<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>给你的表白</title>
<style>
body{background:#ffeeee;font-family:"微软雅黑";text-align:center;margin-top:120px;font-size:22px}
.heart{color:#ff3355;font-size:60px}
</style>
</head>
<body>
<div class="heart">♥</div>
<p id="box"></p >
<script>
const arr = [
"茫茫人海，何其有幸能够遇见你",
"无数瞬间，我都会下意识想起你",
"和你相处，我总是觉得很快乐",
"经过认真思考，我确定我喜欢你",
"我想不止做朋友",
"你愿意做我的恋人吗？"
];
let i = 0;
function show(){
    if(i < arr.length){
        document.getElementById("box").innerText = arr[i];
        i++;
        setTimeout(show,1800);
    }else{
        document.body.innerHTML += "<br><div class='heart'>I LOVE YOU</div>"
    }
}
show();
</script>
</body>
</html>
